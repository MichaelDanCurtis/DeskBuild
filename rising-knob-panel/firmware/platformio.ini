; Rising knob panel firmware for the VIEWE UEDX46460015-MD50ET (ESP32-S3, 1.5" AMOLED knob),
; driving an Actuonix PQ12-R micro linear actuator.
;
;   pio run -e knob -t upload       build + flash the full firmware
;   pio run -e knob_no_display      mechanism only (no AMOLED/LVGL), for bring-up
;   pio test -e native              run the motion/alignment/presence unit tests on your computer

[platformio]
default_envs = knob

[env]
test_framework = unity

[esp32s3_base]
; pioarduino 55.03.35 = Arduino-ESP32 3.3.5 on ESP-IDF 5.5.1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    pololu/VL53L1X@^1.3.1

[env:knob]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DRK_ENABLE_DISPLAY=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    ${esp32s3_base.lib_deps}
    lvgl/lvgl@8.4.0

[env:knob_no_display]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DRK_ENABLE_DISPLAY=0
build_src_filter = +<*> -<display.cpp> -<ui.cpp>

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
